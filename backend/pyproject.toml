[project]
name = "truthlens-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.7",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
